name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING }}'
          channelId: live
          projectId: ptemarkstracking

      - name: Check Firebase Configuration
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING == '' }}"
        run: |
          echo "Notice: Repository secret FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING is not yet configured in GitHub."
          echo "The live app is already hosted at https://ptemarkstracking.web.app."
          echo "To enable GitHub Actions auto-deploy on every push, add FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING in GitHub Settings -> Secrets and variables -> Actions."
