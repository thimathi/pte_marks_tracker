name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa_key.json
            npx firebase-tools deploy --only hosting --project ptemarkstracking
            rm -f sa_key.json
            echo "Successfully deployed to Firebase Hosting!"
          else
            echo "::notice title=Firebase Deploy::FIREBASE_SERVICE_ACCOUNT_PTEMARKSTRACKING secret is not set in GitHub repository settings. Automatic CI deployment skipped. The site is live at https://ptemarkstracking.web.app."
          fi
